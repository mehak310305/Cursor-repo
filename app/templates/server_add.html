{% extends "base.html" %}

{% block title %}Add server — Monitoring Demo{% endblock %}

{% block content %}
<section class="page-head">
  <h1>Add server</h1>
  <p class="muted">Name and hostname/IP only — no SSH credentials (mock metrics).</p>
</section>

<form method="post" action="{{ url_for('main.servers_add') }}" class="form-stack" novalidate>
  {{ form.hidden_tag() }}
  <label>
    <span>Server name</span>
    {{ form.name(class_="input") }}
    {% for error in form.name.errors %}
      <span class="form-error">{{ error }}</span>
    {% endfor %}
  </label>
  <label>
    <span>Hostname / IP</span>
    {{ form.host(class_="input") }}
    {% for error in form.host.errors %}
      <span class="form-error">{{ error }}</span>
    {% endfor %}
  </label>
  {{ form.submit(class_="btn") }}
</form>
{% endblock %}
